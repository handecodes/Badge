<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hande's Badge</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0809">
<style>
:root{--bg:#0b0809;--cream:#eadfcb;--red:#d4352b;--rose:#ff6b81;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--cream);font-family:Georgia,'Times New Roman',serif;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 22px 30px;overflow:hidden}
.slide>img.full,.slide>video{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
/* hero */
.hero{background:radial-gradient(ellipse at 50% 38%,rgba(212,53,43,.22),transparent 62%),var(--bg)}
.hero::before{content:"";position:absolute;inset:8px;border:1px solid rgba(234,223,203,.22);border-radius:20px;pointer-events:none}
.hero::after{content:"";position:absolute;inset:13px;border:1px solid rgba(212,53,43,.45);border-radius:16px;pointer-events:none}
.gif{width:112%;max-width:none;max-height:56%;object-fit:contain;animation:bob 4s ease-in-out infinite;mix-blend-mode:screen}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-weight:400;font-size:clamp(30px,9vmin,52px);letter-spacing:.02em;margin-top:4px;text-align:center;text-shadow:0 0 18px rgba(212,53,43,.5)}
.role{font-family:system-ui,sans-serif;font-size:clamp(12px,3.6vmin,18px);opacity:.85;margin-top:2px;text-align:center}
.term{font-family:ui-monospace,Consolas,monospace;font-size:clamp(12px,3.4vmin,17px);color:var(--rose);margin-top:12px;min-height:1.4em;letter-spacing:.04em}
.cur{display:inline-block;width:.55em;height:1em;background:var(--rose);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.swipe{position:absolute;bottom:24px;font-family:system-ui,sans-serif;font-size:12px;opacity:.55;animation:nudge 2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(8px);opacity:.9}}
/* sparkles */
.sp{position:absolute;color:var(--red);pointer-events:none;animation:tw 3s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5) rotate(0)}50%{opacity:.9;transform:scale(1.1) rotate(25deg)}}
.pop{position:fixed;pointer-events:none;font-size:22px;color:var(--rose);animation:up 1.1s ease-out forwards;z-index:5}
@keyframes up{to{transform:translate(var(--dx),-120px) scale(1.3);opacity:0}}
/* qr */
h2{font-weight:400;font-size:clamp(20px,6vmin,30px);margin-bottom:10px;text-align:center;color:var(--cream)}
.qr{background:#fff;padding:10px;border-radius:14px;width:min(60vmin,100%);aspect-ratio:1;box-shadow:0 0 0 2px var(--red),0 0 28px rgba(212,53,43,.45)}
.qr img{width:100%;height:100%;image-rendering:pixelated}
p.url{margin-top:10px;font-family:system-ui,sans-serif;font-size:clamp(11px,3.2vmin,15px);opacity:.75;text-align:center;word-break:break-all}
p.scan{margin-top:6px;font-family:ui-monospace,monospace;font-size:clamp(11px,3vmin,14px);color:var(--rose)}
#dots{position:fixed;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:9px;pointer-events:none}
#dots i{width:7px;height:7px;transform:rotate(45deg);background:#4a3c3c}
#dots i.on{background:var(--red);box-shadow:0 0 8px var(--red)}
</style></head><body>
<div id="track">
 <section class="slide hero" id="hero">
  <img class="gif" src="wave-clean.gif" alt="">
  <h1>Hande Bengü</h1>
  <div class="role">Fullstack .NET Developer Student</div>
  <div class="term"><span id="typed"></span><span class="cur"></span></div>
  <div class="swipe">swipe &rarr;</div>
 </section>
 <section class="slide"><img class="full" src="badge.png" alt="Hande Bengü badge"></section>
 <section class="slide"><h2>Portfolio</h2><div class="qr"><img src="qr-portfolio.png" alt=""></div><p class="scan">&#10022; scan me &#10022;</p><p class="url">handecodes.github.io/PortfolioPage</p></section>
 <section class="slide"><h2>Side Quests</h2><div class="qr"><img src="qr-sidequests.png" alt=""></div><p class="scan">&#10022; scan me &#10022;</p><p class="url">handecodes.github.io/side-quest</p></section>
 <section class="slide"><h2>LinkedIn</h2><div class="qr"><img src="qr-linkedin.png" alt=""></div><p class="scan">&#10022; scan me &#10022;</p><p class="url">linkedin.com/in/handebengu</p></section>
</div>
<div id="dots"></div>
<script>
const track=document.getElementById('track'),dots=document.getElementById('dots'),hero=document.getElementById('hero');
/* dots */
function buildDots(){dots.innerHTML='';for(let i=0;i<track.children.length;i++)dots.appendChild(document.createElement('i'));mark()}
function mark(){const i=Math.round(track.scrollLeft/track.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i))}
track.addEventListener('scroll',mark,{passive:true});
/* sparkles */
for(let i=0;i<14;i++){const s=document.createElement('span');s.className='sp';s.textContent=i%3?'✦':'✧';
 s.style.left=(4+Math.random()*90)+'%';s.style.top=(4+Math.random()*88)+'%';s.style.fontSize=(10+Math.random()*14)+'px';
 s.style.animationDelay=(Math.random()*3)+'s';s.style.animationDuration=(2.4+Math.random()*2.4)+'s';hero.appendChild(s)}
/* typing line */
const lines=['still compiling.','git commit -m "hi!"','coffee > 0','hello, world'];let li=0,ci=0,del=false;const typed=document.getElementById('typed');
(function tick(){const t=lines[li];
 if(!del){ci++;typed.textContent='> '+t.slice(0,ci);if(ci===t.length){del=true;return setTimeout(tick,1600)}return setTimeout(tick,85)}
 ci--;typed.textContent='> '+t.slice(0,ci);if(ci===0){del=false;li=(li+1)%lines.length;return setTimeout(tick,350)}setTimeout(tick,35)})();
/* tap = hearts */
hero.addEventListener('pointerdown',e=>{for(let k=0;k<4;k++){const p=document.createElement('span');p.className='pop';p.textContent=['♥','✦','♥','✧'][k];
 p.style.left=(e.clientX-8+(Math.random()*40-20))+'px';p.style.top=(e.clientY-8)+'px';p.style.setProperty('--dx',(Math.random()*80-40)+'px');p.style.animationDelay=(k*60)+'ms';
 document.body.appendChild(p);setTimeout(()=>p.remove(),1500)}});
/* media from media.json */
fetch('media.json').then(r=>r.json()).then(list=>{
 for(const f of list){const s=document.createElement('section');s.className='slide';
  const v=/\.(mp4|webm|mov)$/i.test(f);const el=document.createElement(v?'video':'img');el.src='media/'+f;if(!v)el.className='full';
  if(v){el.controls=true;el.playsInline=true;el.loop=true}s.appendChild(el);track.appendChild(s)}
}).catch(()=>{}).finally(buildDots);
/* back to the first slide after 45 s of no touching */
let idle;function resetIdle(){clearTimeout(idle);idle=setTimeout(()=>{if(track.scrollLeft>5)track.scrollTo({left:0,behavior:'smooth'})},45000)}
['pointerdown','scroll','touchstart'].forEach(ev=>track.addEventListener(ev,resetIdle,{passive:true}));resetIdle();
/* keep screen on */
let lock=null;async function wake(){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}
wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});document.addEventListener('click',wake);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
